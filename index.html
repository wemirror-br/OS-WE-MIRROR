<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WE MIRROR — ordem de produção</title>
<meta name="description" content="Programação diária de produção de espelhos e bandejas.">
<meta name="theme-color" content="#24413B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone-192.png">
<link rel="apple-touch-icon" href="./icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WE MIRROR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-startup-image" href="./abertura-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./abertura-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./abertura-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./abertura-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./abertura-1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./abertura-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./abertura-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="./abertura-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<meta property="og:type" content="website">
<meta property="og:title" content="WE MIRROR — ordem de produção">
<meta property="og:description" content="Programação diária de produção de espelhos e bandejas.">
<meta property="og:image" content="https://wemirror-br.github.io/OS-WE-MIRROR/capa.png">
<meta property="og:url" content="https://wemirror-br.github.io/OS-WE-MIRROR/">
<meta name="twitter:card" content="summary_large_image">
<style>html,body{margin:0;padding:0;background:#EDEFEA;-webkit-tap-highlight-color:transparent}</style>
</head>
<body>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16211F; --petrol:#24413B; --petrol-2:#35564F;
    --paper:#EDEFEA; --panel:#FFFFFF; --line:#D5D9D2; --line-2:#E6E9E3;
    --ochre:#A2650F; --ochre-soft:#F7EBD7; --rust:#8C3A2B; --mute:#6C7A75;
    --sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
    --slab:'Zilla Slab',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  #app{font-family:var(--sans);color:var(--ink);background:var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased}
  #app *{font-variant-numeric:tabular-nums}

  /* ---------- topo ---------- */
  .top{background:var(--petrol);color:#fff;padding:14px 16px 13px}
  .top h1{margin:0;line-height:0}
  .marca{display:block;height:19px;width:154px;color:#fff}
  .marca-grande{display:block;height:30px;width:244px;color:var(--ink);margin:0 auto 18px}
  .marca-papel{display:block;height:20px;width:163px;color:#000}
  .top p{font-size:12.5px;color:#B6C7C2;margin-top:2px}
  .top .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .savedot{font-size:11.5px;color:#9FB5AF;white-space:nowrap;padding-top:4px;text-align:right}
  .tprofile{display:block;margin-top:3px;margin-left:auto;background:none;border:0;padding:0;
    font-family:var(--sans);font-size:11.5px;color:#B6C7C2;cursor:pointer;text-decoration:underline}
  .trava{max-width:330px;margin:26px auto;text-align:center}
  .trava .sub{margin-bottom:14px}
  .trava h2{font-size:19px;margin-bottom:4px}
  .trava .btn{width:100%;margin-top:8px;padding:11px 12px}
  .trava .btn small{display:block;font-size:11.5px;font-weight:400;opacity:.72;margin-top:2px}
  .erro{font-size:13px;color:var(--rust);margin-top:8px}
  .savedot.on{color:#F0D9A8}

  /* ---------- conteúdo ---------- */
  main{flex:1;padding:14px 16px calc(104px + env(safe-area-inset-bottom,0));max-width:900px;width:100%;margin:0 auto}
  section{margin-bottom:18px}
  h2{font-family:var(--slab);font-size:16px;font-weight:600;margin-bottom:8px}
  .sub{font-size:12.5px;color:var(--mute)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:3px}
  .pad{padding:12px 13px}

  /* ---------- semana ---------- */
  .weeknav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .weeknav .lbl{flex:1;text-align:center;font-family:var(--slab);font-size:15.5px;font-weight:600}
  .arrow{width:38px;height:38px;flex:none;border:1px solid var(--line);background:var(--panel);
    border-radius:3px;font-size:17px;color:var(--petrol);cursor:pointer;font-family:var(--sans)}
  .arrow:hover{background:var(--line-2)}
  .days{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}
  .day{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:7px 2px 6px;
    text-align:center;cursor:pointer;font-family:var(--sans)}
  .day b{display:block;font-size:15px;font-weight:600;line-height:1.1}
  .day i{display:block;font-style:normal;font-size:10.5px;color:var(--mute);margin-top:1px}
  .day u{display:block;text-decoration:none;font-size:11px;font-weight:600;color:var(--ochre);margin-top:3px;min-height:14px}
  .day.sel{background:var(--petrol);border-color:var(--petrol);color:#fff}
  .day.sel i{color:#B6C7C2} .day.sel u{color:#F0D9A8}
  .day.today:not(.sel){border-color:var(--ochre);border-width:1.5px}

  /* ---------- números grandes ---------- */
  .figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
  .fig{background:var(--panel);padding:9px 10px 10px;min-width:0}
  .fig span{display:block;font-size:11.5px;color:var(--mute);letter-spacing:.01em}
  .fig b{display:block;font-family:var(--slab);font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:1px}
  .fig b em{font-style:normal;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--mute);margin-left:3px}

  /* ---------- lista de produtos ---------- */
  .tools{display:flex;gap:7px;margin-bottom:9px}
  ::placeholder{color:#A9B3AF}
  input[type=text],input[type=date],input[type=number],select,textarea{
    font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:3px;padding:9px 10px;width:100%}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.day:focus-visible{
    outline:2px solid var(--ochre);outline-offset:1px}
  .btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:9px 13px;border-radius:3px;
    border:1px solid var(--petrol);background:var(--petrol);color:#fff;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--petrol-2)}
  .btn.ghost{background:var(--panel);color:var(--petrol)}
  .btn.ghost:hover{background:var(--line-2)}
  .btn.danger{border-color:var(--rust);background:var(--panel);color:var(--rust)}
  .btn:disabled{opacity:.45;cursor:default}

  .grp{font-family:var(--slab);font-size:12.5px;font-weight:600;color:var(--petrol);
    background:var(--line-2);padding:5px 13px;border-bottom:1px solid var(--line)}
  .item{display:flex;align-items:center;gap:10px;padding:7px 13px;border-bottom:1px solid var(--line-2)}
  .item:last-child{border-bottom:0}
  .item label{flex:1;font-size:14px;line-height:1.3}
  .item .qty{width:78px;flex:none;text-align:right;font-weight:600;padding:7px 8px}
  .item .qty.has{border-color:var(--ochre);background:#FFFDF8}
  .item .hint{font-size:11.5px;color:var(--mute);display:block;margin-top:1px}

  /* ---------- tabela de programação ---------- */
  table{width:100%;border-collapse:collapse}
  .plist .prow{display:grid;grid-template-columns:1fr auto;gap:1px 12px;align-items:center;
    padding:8px 12px;border-bottom:1px solid var(--line-2)}
  .plist .prow:last-child{border-bottom:0}
  .plist .pn{font-size:14px;line-height:1.3}
  .plist .pd{grid-column:1;display:flex;flex-wrap:wrap;gap:2px 11px}
  .plist .c{font-size:12px;color:var(--mute)}
  .plist .c::before{content:attr(data-l) " ";color:#98A5A0}
  .plist .pf{grid-row:1 / span 2;grid-column:2;font-family:var(--slab);font-weight:700;
    font-size:21px;letter-spacing:-.02em;text-align:right;min-width:62px;
    background:var(--ochre-soft);border-radius:2px;padding:3px 7px}
  .plist .phead{display:none}
  .plist.d3 .prow{grid-template-columns:1fr auto auto;gap:1px 9px}
  .plist.f2 .prow{grid-template-columns:1fr auto auto;gap:1px 8px}
  .plist.f2 .pin.v{grid-column:2;grid-row:1 / span 2}
  .plist.f2 .pin.p{grid-column:3;grid-row:1 / span 2}
  @media (max-width:719px){
    .graf{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .graf svg{min-width:520px}
    .plist.d3 .prow{grid-template-columns:1fr 62px 64px}
    .plist.d3 .pf{width:62px;min-width:0}
    .plist.d3 .pin{width:64px}
    .plist.d3 .phead{display:grid;background:var(--petrol);border-bottom:0;padding:7px 12px}
    .plist.d3 .phead .pn{color:#DCE5E2;font-size:11px;font-weight:600;line-height:1.2}
    .plist.d3 .phead .pd{display:none}
    .plist.d3 .phead .pf{background:none;padding:0;font-family:var(--sans);font-size:11px;
      font-weight:600;color:#DCE5E2;grid-row:1;grid-column:2;text-align:right;letter-spacing:0}
    .plist.d3 .phead .ph6{display:block;color:#DCE5E2;font-size:11px;font-weight:600;
      grid-row:1;grid-column:3;text-align:right;align-self:end}
    .plist.d3 .phead .ph6::before{display:none}
    .plist.f2 .prow{grid-template-columns:1fr 64px 64px}
    .plist.f2 .pin{width:64px}
    .plist.f2 .phead{display:grid;background:var(--petrol);border-bottom:0;padding:7px 12px}
    .plist.f2 .phead .pn{color:#DCE5E2;font-size:11px;font-weight:600;line-height:1.2}
    .plist.f2 .phead .pd{display:none}
    .plist.f2 .phead .c{color:#DCE5E2;font-size:11px;font-weight:600;text-align:right;
      align-self:end;grid-row:1}
    .plist.f2 .phead .c::before{display:none}
    .plist.f2 .phead .fh3{grid-column:2}
    .plist.f2 .phead .fh4{grid-column:3}
  }
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
  .kpi{background:var(--panel);padding:10px 11px 11px;min-width:0}
  .kpi span{display:block;font-size:11.5px;color:var(--mute)}
  .kpi b{display:block;font-family:var(--slab);font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .kpi i{display:block;font-style:normal;font-size:11.5px;margin-top:1px;color:var(--mute)}
  .kpi i.sobe{color:#2C6B4E} .kpi i.desce{color:var(--rust)}
  .barras{padding:12px 13px 4px}
  .barra{margin-bottom:10px}
  .barra .rot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:3px}
  .barra .rot em{font-style:normal;color:var(--mute);white-space:nowrap}
  .barra .tri{height:8px;background:var(--line-2);border-radius:2px;overflow:hidden}
  .barra .tri>i{display:block;height:100%;background:var(--petrol)}
  .barra.ocre .tri>i{background:var(--ochre)}
  .colunas{display:flex;align-items:flex-end;gap:9px;padding:14px 13px 10px}
  .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
  .col .v{font-size:11.5px;font-weight:600;margin-bottom:4px}
  .col .b{width:100%;background:var(--petrol);border-radius:2px 2px 0 0}
  .col.dest .b{background:var(--ochre)}
  .col .l{font-size:11px;color:var(--mute);margin-top:6px;white-space:nowrap}
  .resumo{background:#F3F6F3;border:1px solid var(--line);border-left:3px solid var(--petrol);
    border-radius:3px;padding:11px 12px;margin-bottom:14px;font-size:13px;line-height:1.6}
  .resumo b{font-weight:600}
  .dica{background:#F3F6F3;border:1px solid var(--line);border-left:3px solid var(--petrol);
    border-radius:3px;padding:9px 11px;margin-bottom:13px;font-size:12.5px;line-height:1.55;color:var(--ink)}
  .dica b{font-weight:600}
  .passos{counter-reset:pa;margin:2px 0 0;list-style:none}
  .passos li{counter-increment:pa;position:relative;padding:3px 0 3px 25px;font-size:12.8px;line-height:1.5}
  .passos li::before{content:counter(pa);position:absolute;left:0;top:3px;width:18px;height:18px;
    border-radius:50%;background:var(--petrol);color:#fff;font-size:11px;font-weight:600;
    display:flex;align-items:center;justify-content:center}
  .leitura{border-left:2.5px solid var(--ochre);margin:2px 13px 13px;padding:1px 0 1px 11px;
    font-size:12.5px;line-height:1.55;color:var(--ink)}
  .leitura b{font-weight:600}
  .graf{padding:10px 8px 6px}
  .graf svg{display:block;width:100%;height:auto}
  .rosca{display:flex;align-items:center;gap:12px;padding:12px 13px;flex-wrap:wrap}
  .rosca svg{width:150px;height:150px;flex:none}
  .legenda{list-style:none;flex:1;min-width:150px}
  .legenda li{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:2.5px 0}
  .legenda li i{width:10px;height:10px;border-radius:2px;flex:none}
  .legenda li span{flex:1}
  .legenda li em{font-style:normal;color:var(--mute);white-space:nowrap;font-size:11.5px}
  h3.bloco{font-family:var(--slab);font-size:13.5px;font-weight:600;color:var(--petrol);
    margin:16px 0 6px;letter-spacing:.01em}
  .seg{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .seg button{flex:1;background:var(--panel);border:0;padding:9px 6px;cursor:pointer;
    font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--mute)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.sel{background:var(--petrol);color:#fff}
  .plist .pin{grid-row:1 / span 2;grid-column:3;width:64px;text-align:right;
    padding:6px 7px;font-weight:600;font-size:14px}
  .plist .pin.has{border-color:var(--petrol);background:#F4F7F5}
  .tag{font-style:normal;font-size:10.5px;font-weight:600;color:#7A4A08;background:#F3DFBC;
    border-radius:2px;padding:1px 5px;margin-left:5px;white-space:nowrap}
  .tag.late{color:#71291C;background:#F0D2CA}
  .plist .ptot{background:var(--line-2);font-weight:700}
  .plist .ptot .pf{background:none;padding-right:7px}
  @media (min-width:720px){
    .plist .prow{grid-template-columns:1fr 74px 84px 88px 96px;gap:0 8px;padding:7px 12px}
    .plist .pd{display:contents}
    .plist .prow>.pn{grid-column:1;grid-row:1}
    .plist .c{text-align:right;font-size:13.5px;color:var(--ink)}
    .plist .c::before{display:none}
    .plist .pd>.c:nth-child(1){grid-column:2;grid-row:1}
    .plist .pd>.c:nth-child(2){grid-column:3;grid-row:1}
    .plist .pd>.c:nth-child(3){grid-column:4;grid-row:1}
    .plist .pf{grid-row:1;grid-column:5;font-size:16px}
    .plist.d3 .prow{grid-template-columns:1fr 64px 84px 74px 82px 80px}
    .plist.d3 .pf{grid-column:5}
    .plist .pin{grid-row:1;grid-column:6;width:100%}
    .plist .ph6{grid-column:6;text-align:right}
    .plist.f2 .prow{grid-template-columns:1fr 86px 92px 92px;gap:0 8px}
    .plist.f2 .pd{display:contents}
    .plist.f2 .pd>.c:nth-child(1){grid-column:2;grid-row:1}
    .plist.f2 .pin.v{grid-column:3;grid-row:1;width:100%}
    .plist.f2 .pin.p{grid-column:4;grid-row:1;width:100%}
    .plist.f2 .fh3{grid-column:3;text-align:right}
    .plist.f2 .fh4{grid-column:4;text-align:right}
    .plist .phead{display:grid;background:var(--petrol);border-bottom:0;padding:8px 12px}
    .plist .phead .pn,.plist .phead .c,.plist .phead .pf{font-family:var(--sans);font-size:11px;
      font-weight:600;color:#DCE5E2;background:none;padding:0;line-height:1.2}
  }
  .tablewrap{overflow-x:auto}
  table.wide{min-width:520px}
  th,td{padding:7px 8px;font-size:13.5px;text-align:right;border-bottom:1px solid var(--line-2)}
  th{font-family:var(--sans);font-size:11px;font-weight:600;color:#DCE5E2;background:var(--petrol);
    border-bottom:0;line-height:1.2;vertical-align:bottom}
  th:first-child,td:first-child{text-align:left}
  td.prod{font-size:13.5px;line-height:1.25}
  td.make{font-weight:700;font-size:15px;background:var(--ochre-soft);font-family:var(--slab)}
  tr.sub td{background:var(--line-2);font-weight:700;font-size:13px}
  .zero{color:var(--mute)}

  .note{font-size:12.5px;color:var(--mute);margin-top:7px;line-height:1.5}
  .warn{background:#FBF0EC;border:1px solid #E4C4BB;border-radius:3px;padding:9px 11px;
    font-size:13px;color:#6E2E22;margin-bottom:12px}
  .ok{background:var(--ochre-soft);border:1px solid #E3CDA6;border-radius:3px;padding:9px 11px;
    font-size:13px;margin-bottom:12px}
  .field{margin-bottom:11px}
  .field span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px}

  /* ---------- abas ---------- */
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);
    border-top:1px solid var(--line);box-shadow:0 -1px 6px rgba(22,33,31,.07);
    padding-bottom:env(safe-area-inset-bottom,0)}
  nav button{flex:1;background:none;border:0;padding:9px 4px 11px;cursor:pointer;font-family:var(--sans);
    font-size:11.5px;font-weight:600;color:var(--mute);border-top:2.5px solid transparent}
  nav button b{display:block;font-family:var(--slab);font-size:15px;font-weight:600;line-height:1.2}
  nav button.sel{color:var(--petrol);border-top-color:var(--ochre)}
  @media (min-width:720px){
    nav{position:static;box-shadow:none;border-top:0;border-bottom:1px solid var(--line);
      max-width:900px;margin:0 auto;width:100%;background:var(--paper)}
    nav button{flex:none;padding:11px 16px;border-top:0;border-bottom:2.5px solid transparent}
    nav button.sel{border-bottom-color:var(--ochre)}
    nav button b{display:inline;font-size:15px}
    main{padding-bottom:30px}
    .two{grid-template-columns:1fr 1fr 1fr}
  }
  #modal{position:fixed;inset:0;background:rgba(22,33,31,.5);display:none;align-items:center;
    justify-content:center;padding:16px;z-index:20}
  #modal.on{display:flex}
  #modal .box{background:var(--panel);border-radius:4px;max-width:520px;width:100%;padding:16px;
    max-height:88%;overflow:auto}
  #modal h3{font-family:var(--slab);font-size:17px;font-weight:600;margin-bottom:6px}
  #print{display:none}
  @media print{
    nav,.top,.tools,.weeknav,.days,#modal{display:none!important}
    #app{display:none!important}
    main{display:none}
    html,body{background:#fff}
    #print{display:block;padding:0;font-family:var(--sans);color:#000}
    #print .marca-papel{height:15px;width:122px;color:#000;margin:0}
    #print h1{font-family:var(--slab);font-size:19px;margin-bottom:2px}

<script>
/* --- onde os dados ficam guardados ---------------------------------------
   Dentro do Claude existe window.storage. Fora dele (site, celular, PWA)
   usamos o armazenamento do próprio navegador, com a mesma interface.      */
if(!window.storage){
  const LS=window.localStorage;
  window.storage={
    get:async k=>{const v=LS.getItem(k);if(v===null)throw new Error('sem chave: '+k);
      return {key:k,value:v,shared:false}},
    set:async(k,v)=>{LS.setItem(k,v);return {key:k,value:v,shared:false}},
    delete:async k=>{LS.removeItem(k);return {key:k,deleted:true,shared:false}},
    list:async p=>{const ks=[];for(let i=0;i<LS.length;i++){const k=LS.key(i);
      if(!p||k.startsWith(p))ks.push(k)}return {keys:ks,prefix:p,shared:false}}

function vendaDia(d,pid){return (S.vendas[d]||{})[pid]||0}

  if(q>0)S.vendas[d][pid]=q; else delete S.vendas[d][pid];

    return sSet('esp:vendas:'+mes,bloco);

}
function totalDia(d){return Object.values(S.vendas[d]||{}).reduce((a,b)=>a+b,0)}
function prodDia(d,pid){return (S.producao[d]||{})[pid]||0}
function totalProdDia(d){return Object.values(S.producao[d]||{}).reduce((a,b)=>a+b,0)}
function setProd(d,pid,q){

  salvarDepois('p'+mes,()=>{

    return sSet('esp:producao:'+mes,bloco);

function ordemDe(d){return S.ordens[d]||null}
function setOrdem(d,obj){
  S.ordens[d]=obj;const mes=mesDe(d);
  salvarDepois('o'+mes,()=>{
    const b={};for(const k in S.ordens){if(mesDe(k)===mes&&Object.keys(S.ordens[k]).length)b[k]=S.ordens[k]}
    return sSet('esp:ordem:'+mes,b);
  });
}
function emitirOrdem(d){
  const P=planoDia(d),obj={};
  P.plano.forEach(i=>obj[i.id]=i.qtd);
  setOrdem(d,obj);return P;
}
function itensOrdem(d){
  const P=planoDia(d),sal=ordemDe(d);
  if(!sal)return {emitida:false,itens:P.plano,P};
  const mapa={};P.todos.forEach(i=>mapa[i.id]=i);
  const itens=Object.keys(sal).filter(id=>sal[id]>0).map(id=>{
    const b=mapa[id]||S.produtos.find(x=>x.id===id)||{id,nome:id,est:0,nec:0,diaria:0,cobDias:null};
    return {...b,qtd:sal[id]};
  }).sort((a,b)=>b.qtd-a.qtd);
  return {emitida:true,itens,P};
}
function dataBase(){return S.cfg.contagem||'2026-09-30'}
/* Produção de um dia: o número lançado quando existe. Quando não existe e o app está
   no modo "a fábrica cumpre a ordem", vale a quantidade que foi mandada produzir. */
function prodEfetiva(d,pid){
  const l=prodDia(d,pid);
  if(l>0)return l;
  if(S.cfg.modoProd==='lancada')return 0;
  const o=ordemDe(d);
  return o?(o[pid]||0):0;
}
function estoqueEm(pid,ate){
  const b=dataBase();let v=S.estoque[pid]||0;
  const dias=new Set([...Object.keys(S.producao),...(S.cfg.modoProd==='ordem'?Object.keys(S.ordens):[])]);
  dias.forEach(d=>{if(d>b&&d<=ate)v+=prodEfetiva(d,pid)});
  for(const d in S.vendas)if(d>b&&d<=ate)v-=S.vendas[d][pid]||0;
  return v;
}
/* Ritmo de venda observado nos dias já lançados do mês */
function diariaObservada(mes,pid){
  const dias=Object.keys(S.vendas).filter(d=>mesDe(d)===mes&&Object.keys(S.vendas[d]).length);
  if(!dias.length)return null;
  const t=dias.reduce((a,d)=>a+(S.vendas[d][pid]||0),0);
  return {n:dias.length, media:t/dias.length};
}
/* Mistura o histórico dos meses fechados com o que já foi vendido neste mês.
   Quanto mais dias lançados, mais peso o mês corrente ganha (até 70%). */
function diariaAjustada(mes,pid,base){
  const o=diariaObservada(mes,pid);
  if(!o)return {diaria:base,peso:0,n:0};
  const peso=Math.min(0.7,o.n/15);
  return {diaria:base*(1-peso)+o.media*peso, peso, n:o.n};
}
const estoqueHoje = pid => estoqueEm(pid,iso(HOJE));
function proxDiaUtil(from){let d=addDias(from,1);while(!ehUtil(d))d=addDias(d,1);return d}
function diasUteisDe(dIso){
  const d=new Date(dIso+'T12:00:00'),y=d.getFullYear(),m=d.getMonth();
  let c=0;const u=new Date(y,m+1,0).getDate();
  for(let i=d.getDate();i<=u;i++){const w=new Date(y,m,i).getDay();if(w>=1&&w<=UTIL_MAX)c++}
  return c;
}
function capacidadeSugerida(){
  const ms=mesesComDados().filter(mesFechado).slice(-3);
  if(!ms.length)return 300;
  let t=0,du=0;
  ms.forEach(m=>{const [y,mm]=m.split('-').map(Number);t+=totalMes(m);du+=diasUteisMes(y,mm-1)});
  return du?Math.round(t/du):300;
}
const capacidade = () => S.cfg.capacidade||capacidadeSugerida();
function lancadoNoMes(mes){return Object.keys(S.vendas).some(d=>mesDe(d)===mes&&Object.keys(S.vendas[d]).length)}
function totalMesProduto(mes,pid){
  if(lancadoNoMes(mes)){let t=0;for(const d in S.vendas)if(mesDe(d)===mes)t+=S.vendas[d][pid]||0;return t}
  if(SEED.hist[mes])return SEED.hist[mes][pid]||0;
  return null;
}
function mesTemDados(mes){return lancadoNoMes(mes)||!!SEED.hist[mes]}
function totalMes(mes){return S.produtos.reduce((a,p)=>a+(totalMesProduto(mes,p.id)||0),0)}
function mesesComDados(){
  const set=new Set(Object.keys(SEED.hist));
  for(const d in S.vendas)if(Object.keys(S.vendas[d]).length)set.add(mesDe(d));
  return [...set].sort();
}

/* ------------------------------------------------------------- programação */
function baseHistorica(alvo){
  const out=[];let [y,m]=alvo.split('-').map(Number);
  for(let i=0;i<24&&out.length<3;i++){
    m--;if(m===0){m=12;y--}
    const k=y+'-'+String(m).padStart(2,'0');
    if(mesTemDados(k)&&mesFechado(k))out.push(k);
  }
  return out;
}
function programacao(alvo){
  const base=baseHistorica(alvo);
  const [y,m]=alvo.split('-').map(Number);
  const duTot=S.cfg.dias[alvo]||diasUteisMes(y,m-1);
  const atual = alvo === iso(HOJE).slice(0,7);
  const duRest = atual ? Math.min(duTot,diasRestantesMes(y,m-1)) : duTot;
  const cob=S.cfg.cobertura;
  const itens=S.produtos.map(p=>{
    const vals=base.map(k=>totalMesProduto(k,p.id)).filter(v=>v!==null);
    const prevH=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    const aj=diariaAjustada(alvo,p.id,duTot?prevH/duTot:0);
    const prev=Math.round(aj.diaria*duTot);
    const seg=duTot?Math.round(aj.diaria*cob):0;
    const est=estoqueHoje(p.id);
    const prevRest=Math.round(aj.diaria*duRest);
    return {...p,prev,prevRest,seg,est,fazer:Math.max(0,prevRest+seg-est),semBase:vals.length===0};
  });
  return {base,itens,duTot,duRest,atual,total:itens.reduce((a,i)=>a+i.fazer,0)};
}

function planoDia(dIso){
  const mes=mesDe(dIso), [y,m]=mes.split('-').map(Number);
  const duTot=S.cfg.dias[mes]||diasUteisMes(y,m-1);
  const duRest=Math.max(1,diasUteisDe(dIso));
  const cobMeta=S.cfg.cobertura, cap=capacidade(), lote=Math.max(1,S.cfg.lote||1);
  const ant=iso(addDias(new Date(dIso+'T12:00:00'),-1));
  const base=baseHistorica(mes);
  const arred=q=>lote>1?Math.round(q/lote)*lote:Math.round(q);
  const itens=S.produtos.map(p=>{
    const vals=base.map(k=>totalMesProduto(k,p.id)).filter(v=>v!==null);
    const prevMes=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    const diaria=diariaAjustada(mes,p.id,duTot?prevMes/duTot:0).diaria;
    const est=estoqueEm(p.id,ant);
    const seg=Math.round(diaria*cobMeta);
    const nec=Math.max(0,Math.round(diaria*duRest)+seg-est);
    return {...p,prevMes,diaria,est,seg,nec,cobDias:diaria>0?est/diaria:null};
  });
  const cands=itens.filter(i=>i.nec>0);
  const necMes=cands.reduce((a,i)=>a+i.nec,0);
  const alvo={};let usado=0;
  const posto=i=>alvo[i.id]||0;

  /* 1) primeiro quem corre risco de parar: repõe até dois dias de venda */
  cands.filter(i=>i.diaria>=1&&i.est<i.diaria*2)
       .sort((a,b)=>a.cobDias-b.cobDias)
       .forEach(i=>{
    if(usado>=cap)return;
    const q=Math.min(i.nec,Math.max(lote,arred(i.diaria*2-i.est)),cap-usado);
    if(q>0){alvo[i.id]=posto(i)+q;usado+=q}
  });

  /* 2) o resto da capacidade vai no ritmo do mês, proporcional a cada produto */
  let livre=cap-usado;
  const ritmo=i=>Math.max(0,(i.nec-posto(i))/duRest);
  const soma=cands.reduce((a,i)=>a+ritmo(i),0);
  const f=soma>0?Math.min(1,livre/soma):0;
  cands.slice().sort((a,b)=>ritmo(b)-ritmo(a)).forEach(i=>{
    if(livre<=0)return;
    const q=Math.min(arred(ritmo(i)*f),i.nec-posto(i),livre);
    if(q>0){alvo[i.id]=posto(i)+q;usado+=q;livre-=q}
  });

  /* 3) se sobrou capacidade, fecha os lotes pequenos que ainda faltam */
  cands.slice().sort((a,b)=>(a.nec-posto(a))-(b.nec-posto(b))).forEach(i=>{
    if(livre<=0)return;
    const falta=i.nec-posto(i);
    if(falta>0&&falta<=lote*2&&falta<=livre){alvo[i.id]=posto(i)+falta;usado+=falta;livre-=falta}
  });

  const plano=cands.filter(i=>posto(i)>0).map(i=>({...i,qtd:posto(i)})).sort((a,b)=>b.qtd-a.qtd);
  const fora=cands.filter(i=>posto(i)===0).sort((a,b)=>b.nec-a.nec);
  const precisa=Math.round(necMes/duRest);
  return {dIso,plano,fora,todos:itens,cap,usado,duRest,base,necMes,precisa,
    falta:precisa>cap?Math.round((precisa-cap)*duRest):0,
    urgentes:plano.filter(i=>i.cobDias!==null&&i.cobDias<cobMeta).length};
}

/* ------------------------------------------------------- gráficos (SVG) */
const PAL=['#24413B','#3D6159','#5A8078','#83A39B','#A2650F','#C99A3E','#8C3A2B','#AFBCB7'];
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function tetoBonito(v){
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  return Math.ceil(v/(p/2))*(p/2);
}

/* linha do tempo com área sob a curva */
function gLinha(serie,destaque,op){
  if(serie.length<2){
    return `<p class="note">Um mês só de histórico: o gráfico de evolução aparece a partir do segundo.</p>`;
  }
  const o=op||{}, W=o.W||580, H=o.H||210, ml=o.ml||46, mr=16, mt=24, mb=30;
  const max=tetoBonito(Math.max(...serie.map(x=>x.total)));
  const px=i=>ml+(W-ml-mr)*(serie.length===1?0.5:i/(serie.length-1));
  const py=v=>H-mb-(H-mt-mb)*(v/max);
  const pts=serie.map((x,i)=>[px(i),py(x.total)]);
  const fs=o.fs||11, linha=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=`${ml},${H-mb} ${linha} ${px(serie.length-1)},${H-mb}`;
  let grade='';
  for(let i=0;i<=4;i++){
    const v=max*i/4, y=py(v);
    grade+=`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}" stroke="#DEE3DF" stroke-width="1"/>`
      +`<text x="${ml-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="${fs-1}" fill="#6C7A75">${fmt0(v)}</text>`;
  }
  const marcas=serie.map((x,i)=>{
    const d=x.mes===destaque;
    const ult=i===serie.length-1;
    const anc=i===0?'start':(ult?'end':'middle');
    const dx=i===0?5:(ult?-5:0);
    return `<circle cx="${px(i).toFixed(1)}" cy="${py(x.total).toFixed(1)}" r="${d?5:3.6}"
       fill="${d?'#A2650F':'#24413B'}" stroke="#fff" stroke-width="1.5"/>
      <text x="${(px(i)+dx).toFixed(1)}" y="${(py(x.total)-11).toFixed(1)}" text-anchor="${anc}"
       font-size="${fs+1}" font-weight="600" fill="${d?'#A2650F':'#24413B'}">${fmt0(x.total)}</text>
      <text x="${px(i).toFixed(1)}" y="${H-mb+15}" text-anchor="middle" font-size="${fs}"
       fill="#6C7A75">${mesCurto(x.mes)}</text>`;
  }).join('');
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Evolução da produção mês a mês">
    ${grade}
    <polygon points="${area}" fill="#24413B" opacity="0.09"/>
    <polyline points="${linha}" fill="none" stroke="#24413B" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${marcas}
  </svg></div>`;
}

/* rosca com legenda */
function gRosca(dados,total,rotulo){
  const R=92,r=54,cx=104,cy=104;
  let ang=-Math.PI/2, fatias='';
  if(dados.length===1){
    fatias=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${PAL[0]}" stroke-width="${R-r}"/>`;
  } else dados.forEach(([k,v],i)=>{
    const a=Math.max(v/total*Math.PI*2, 0.004);
    const P=(rr,t)=>[(cx+rr*Math.cos(t)).toFixed(2),(cy+rr*Math.sin(t)).toFixed(2)];
    const [x1,y1]=P(R,ang),[x2,y2]=P(R,ang+a),[x3,y3]=P(r,ang+a),[x4,y4]=P(r,ang);
    const big=a>Math.PI?1:0;
    fatias+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z"
      fill="${PAL[i%PAL.length]}" stroke="#fff" stroke-width="1"/>`;
    ang+=a;
  });
  const leg=dados.map(([k,v],i)=>`<li><i style="background:${PAL[i%PAL.length]}"></i>
    <span>${esc(k)}</span><em>${fmt0(v)} · ${(v/total*100).toFixed(0)}%</em></li>`).join('');
  return `<div class="rosca">
    <svg viewBox="0 0 208 208" role="img" aria-label="${esc(rotulo||'Composição')}">${fatias}
      <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="26" font-weight="700"
        font-family="Zilla Slab, Georgia, serif" fill="#16211F">${fmt0(total)}</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="11" fill="#6C7A75">peças</text>
    </svg>
    <ul class="legenda">${leg}</ul></div>`;
}

/* Pareto: barras dos maiores + curva acumulada e linha dos 80% */
function gPareto(itens,total,op){
  const o=op||{}, lista=itens.slice(0,o.n||10);
  const W=o.W||580, H=o.H||225, ml=40, mr=o.mr||38, mt=18, mb=o.mb||64;
  const max=tetoBonito(lista[0].q);
  const lw=(W-ml-mr)/lista.length;
  let barras='',curva=[],rot='';
  let acc=0;
  lista.forEach((i,n)=>{
    const x=ml+n*lw, h=(H-mt-mb)*(i.q/max);
    barras+=`<rect x="${(x+lw*0.16).toFixed(1)}" y="${(H-mb-h).toFixed(1)}"
      width="${(lw*0.68).toFixed(1)}" height="${h.toFixed(1)}" fill="${PAL[0]}" rx="1.5"/>
      <text x="${(x+lw/2).toFixed(1)}" y="${(H-mb-h-5).toFixed(1)}" text-anchor="middle"
        font-size="${o.fsv||9.5}" font-weight="600" fill="#24413B">${fmt0(i.q)}</text>`;
    acc+=i.q;
    curva.push([x+lw/2, mt+(H-mt-mb)*(1-acc/total)]);
    const lim=o.lim||17;
    const nome=i.nome.length>lim?i.nome.slice(0,lim-1)+'…':i.nome;
    rot+=`<text transform="translate(${(x+lw/2).toFixed(1)} ${H-mb+8}) rotate(38)"
      font-size="${o.fs||8.6}" fill="#6C7A75">${esc(nome)}</text>`;
  });
  const y80=mt+(H-mt-mb)*(1-0.8);
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Curva ABC dos dez maiores produtos">
    <line x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}" stroke="#C9D0CB"/>
    <line x1="${ml}" y1="${y80.toFixed(1)}" x2="${W-mr}" y2="${y80.toFixed(1)}"
      stroke="#8C3A2B" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="${W-mr+3}" y="${(y80+3.5).toFixed(1)}" font-size="9.5" fill="#8C3A2B">80%</text>
    ${barras}
    <polyline points="${curva.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"
      fill="none" stroke="#A2650F" stroke-width="2"/>
    ${curva.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#A2650F"/>`).join('')}
    ${rot}
  </svg></div>`;
}

/* barras divergentes: altas e quedas */
function gDiverg(lista,op){
  if(!lista.length)return '';
  const o=op||{}, W=o.W||580, lh=o.lh||21, mt=6;
  const H=mt*2+lista.length*lh;
  const max=Math.max(...lista.map(x=>Math.abs(x.d)))||1;
  const xRot=o.xRot||196, x0=xRot+10, x1=W-6, mc=(x0+x1)/2, larg=(x1-mc)-42;
  const linhas=lista.map((x,n)=>{
    const y=mt+n*lh, w=larg*Math.abs(x.d)/max;
    const pos=x.d>0;
    const lim=o.lim||34, nome=x.nome.length>lim?x.nome.slice(0,lim-1)+'…':x.nome;
    const fs=o.fs||10, alt=Math.round(lh*0.55);
    return `<text x="${xRot}" y="${y+lh*0.68}" text-anchor="end" font-size="${fs}" fill="#16211F">${esc(nome)}</text>
      <rect x="${pos?mc:mc-w}" y="${y+(lh-alt)/2}" width="${w.toFixed(1)}" height="${alt}" rx="1.5"
        fill="${pos?'#3D6159':'#8C3A2B'}"/>
      <text x="${pos?mc+w+5:mc-w-5}" y="${y+lh*0.68}" text-anchor="${pos?'start':'end'}"
        font-size="${fs}" font-weight="600" fill="${pos?'#2C6B4E':'#8C3A2B'}">${x.d>0?'+':''}${fmt0(x.d)}</text>`;
  }).join('');
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Variação por produto contra o mês anterior">
    <line x1="${mc}" y1="${mt}" x2="${mc}" y2="${H-mt}" stroke="#C9D0CB"/>
    ${linhas}
  </svg></div>`;
}


/* ------------------------------------- leituras automáticas dos gráficos */
function duDe(mes){
  const [y,m]=mes.split('-').map(Number);
  return S.cfg.dias[mes]||diasUteisMes(y,m-1);
}
function leituraEvolucao(A){
  if(!A.ant)return '';
  const duA=duDe(A.ant), pdA=A.totalAnt/duA, pd=A.total/A.du;
  const dTot=(A.total/A.totalAnt-1)*100, dDia=(pd/pdA-1)*100;
  const pico=A.serie.reduce((a,b)=>b.total>a.total?b:a);
  let t;
  if(dTot<0&&dDia>0){
    t=`No total, ${mesNome(A.mes)} recuou ${pc(Math.abs(dTot))}% contra ${mesNome(A.ant)} —
       mas com ${duA-A.du} ${duA-A.du>1?'dias úteis':'dia útil'} a menos.
       <b>Por dia útil a fábrica subiu</b>, de ${fmt0(pdA)} para ${fmt0(pd)} peças (+${pc(dDia)}%).`;
  } else if(dTot>0&&dDia<0){
    t=`${Mai(mesNome(A.mes))} produziu ${pc(dTot)}% mais no total, mas isso veio de
       ${A.du-duA} ${A.du-duA>1?'dias úteis':'dia útil'} a mais: <b>por dia útil o ritmo caiu</b>,
       de ${fmt0(pdA)} para ${fmt0(pd)} peças.`;
  } else if(dTot>=0){
    t=`Alta de ${pc(dTot)}% no total e de ${pc(dDia)}% por dia útil,
       de ${fmt0(pdA)} para ${fmt0(pd)} peças. <b>Crescimento de ritmo, não de calendário.</b>`;
  } else {
    t=`Queda de ${pc(Math.abs(dTot))}% no total e de ${pc(Math.abs(dDia))}% por dia útil,
       de ${fmt0(pdA)} para ${fmt0(pd)} peças. <b>A perda não se explica pelo calendário.</b>`;
  }
  if(pico.mes!==A.mes) t+=` ${Mai(mesNome(pico.mes))} segue como o maior volume da série (${fmt0(pico.total)} peças).`;
  else t+=` É o maior volume da série até agora.`;
  return `<div class="leitura">${t}</div>`;
}
function leituraLinhas(A){
  if(!A.linhas.length)return '';
  const tot=A.total, [n1,v1]=A.linhas[0], p1=v1/tot*100;
  let peso;
  if(p1>=60) peso='a maior parte de tudo que a fábrica faz';
  else if(p1>=47) peso='metade de tudo que a fábrica faz';
  else if(p1>=30) peso='a linha mais forte';
  else peso='a linha mais forte, sem dominar o mix';
  let t=`A <b>${n1}</b> é ${peso}: ${fmt0(v1)} peças, ${p1.toFixed(0)}% do mês.`;
  if(A.linhas.length>=3){
    const [n2,v2]=A.linhas[1], [n3,v3]=A.linhas[2];
    const p=( (v1+v2+v3)/tot*100 );
    t+=` Com <b>${n2}</b> (${(v2/tot*100).toFixed(0)}%) e <b>${n3}</b> (${(v3/tot*100).toFixed(0)}%),
      as três somam ${p.toFixed(0)}% da fábrica — o resto do catálogo divide os
      ${(100-p).toFixed(0)}% que sobram.`;
  }
  return `<div class="leitura">${t}</div>`;
}
function leituraCores(A){
  if(!A.cores.length)return '';
  const [n1,v1]=A.cores[0], p1=v1/A.total*100;
  let t=`<b>${n1}</b> é ${p1.toFixed(0)}% da produção.`;
  if(p1>=60) t+=` Concentração alta, e ela abre duas conversas: o <b>risco</b> de a fábrica
    depender de um acabamento só, e a <b>oportunidade</b> que existe nos outros.`;
  else if(p1>=40) t+=` Concentração relevante, ainda sem virar dependência — vale acompanhar
    se a distância aumenta nos próximos meses.`;
  else t+=` A produção está bem distribuída entre acabamentos, o que reduz o risco de depender
    de um só.`;
  return `<div class="leitura">${t}</div>`;
}
function resumoExecutivo(A){
  const [l1,v1]=A.linhas[0]||['—',0], [c1,vc1]=A.cores[0]||['—',0];
  let t=`Em ${mesNome(A.mes)} a fábrica produziu <b>${fmt0(A.total)} peças</b> em ${A.du} dias úteis,
    uma média de <b>${fmt0(A.porDia)} peças por dia</b>.`;
  if(A.ant){
    const pdA=A.totalAnt/duDe(A.ant);
    const d=(A.porDia/pdA-1)*100;
    t+=` O ritmo diário ${d>=0?'subiu':'caiu'} ${pc(Math.abs(d))}% contra ${mesNome(A.ant)}
      (${fmt0(pdA)} peças por dia).`;
  }
  t+=` A produção continua concentrada: <b>${l1}</b> responde por ${(v1/A.total*100).toFixed(0)}% do
    volume, o acabamento <b>${c1}</b> por ${(vc1/A.total*100).toFixed(0)}%, e
    <b>${A.n80} de ${A.itens.length} produtos ativos</b> formam 80% de tudo que saiu.`;
  return `<div class="resumo">${t}</div>`;
}
function leituraABC(A){
  const resto=A.itens.length-A.n80;
  return `<div class="leitura"><b>${A.n80} produtos de ${A.itens.length}</b> respondem por 80% do
    volume. É a informação que muda a prioridade da fábrica e do estoque: ruptura nesses ${A.n80}
    custa caro e para o faturamento, enquanto os outros ${resto} podem esperar sem quebrar o mês.</div>`;
}

/* ------------------------------------------------------------- análise */
function linhaDe(nome){
  const n=chave(nome);
  if(n.includes('smoldura'))return 'Sem moldura';
  if(n.includes('bandeja'))return 'Bandejas';
  if(n.includes('lumina'))return 'Lumina';
  if(n.includes('feijao'))return 'Feijão';
  if(n.includes('urso'))return 'Urso';
  if(n.includes('effect'))return 'Effect';
  if(n.includes('organico'))return 'Orgânico';
  if(n.includes('empire'))return 'Empire';
  if(n.includes('meialua'))return 'Meia Lua';
  if(n.includes('redondo'))return 'Redondo';
  return 'Outros';
}
function corDe(nome){
  const n=chave(nome);
  if(n.includes('strass'))return 'Strass';
  if(n.includes('marrom'))return 'Marrom';
  if(n.includes('preto'))return 'Preto';
  if(n.includes('branco'))return 'Branco';
  return 'Outras';
}
function mesAnterior(mes){
  const ms=mesesComDados().filter(m=>m<mes);
  return ms.length?ms[ms.length-1]:null;
}
function analiseMes(mes){
  const [y,m]=mes.split('-').map(Number);
  const du=S.cfg.dias[mes]||diasUteisMes(y,m-1);
  const itens=S.produtos.map(p=>({...p,q:totalMesProduto(mes,p.id)||0}))
    .filter(i=>i.q>0).sort((a,b)=>b.q-a.q);
  const total=itens.reduce((a,i)=>a+i.q,0);
  const ant=mesAnterior(mes);
  const totalAnt=ant?totalMes(ant):null;
  const soma=(f)=>{
    const mapa={};
    itens.forEach(i=>{const k=f(i.nome);mapa[k]=(mapa[k]||0)+i.q});
    return Object.entries(mapa).sort((a,b)=>b[1]-a[1]);
  };
  // concentracao: quantos produtos formam 80% do volume
  let acc=0,n80=0;
  for(const i of itens){acc+=i.q;n80++;if(acc>=total*0.8)break}
  // variacoes contra o mes anterior
  const varia=ant?S.produtos.map(p=>{
    const a=totalMesProduto(ant,p.id)||0, b=totalMesProduto(mes,p.id)||0;
    return {nome:p.nome,a,b,d:b-a};
  }).filter(x=>x.d!==0).sort((x,z)=>z.d-x.d):[];
  const meses=mesesComDados();
  return {mes,du,itens,total,ant,totalAnt,
    porDia:du?total/du:0,
    linhas:soma(linhaDe), cores:soma(corDe),
    grupos:[['Sem costura',itens.filter(i=>i.grupo==='S').reduce((a,i)=>a+i.q,0)],
            ['Com costura',itens.filter(i=>i.grupo==='C').reduce((a,i)=>a+i.q,0)]],
    n80, top:itens.slice(0,10),
    altas:varia.slice(0,5), quedas:varia.slice(-5).reverse().filter(x=>x.d<0),
    serie:meses.map(k=>({mes:k,total:totalMes(k)}))};
}

  const ehHoje=dataDia===iso(HOJE);
  if(!ehGestor())modoDia='ordem';
  const nav=`<div class="weeknav">
      <button class="arrow" data-dnav="-1" aria-label="Dia anterior">‹</button>
      <span class="lbl">${rot}${ehHoje?' · hoje':''}</span>
      <button class="arrow" data-dnav="1" aria-label="Próximo dia">›</button>
    </div>
    ${ehGestor()?`<div class="seg">
      <button data-modo="ordem" class="${modoDia==='ordem'?'sel':''}">Ordem de produção</button>
      <button data-modo="fechar" class="${modoDia==='fechar'?'sel':''}">Fechar o dia</button>
    </div>`:''}`;

         ${S.cfg.modoProd==='ordem'
           ? 'A coluna <b>Produzido</b> só precisa ser tocada se a fábrica fez diferente da ordem.'

}

  else if(P.falta)aviso=`<div class="warn">O mês pede ${fmt0(P.precisa)} peças por dia útil e a capacidade informada é ${fmt0(P.cap)}.

        <div class="pd"><span class="c">Estoque</span></div>
        <span class="c fh3">Vendido</span><span class="c fh4">Produzido</span></div>
      ${rows||'<div class="pad sub">Nenhum produto na lista deste dia. Use a busca ou o botão Todos.</div>'}
    </div>
    <div class="tools" style="margin-top:14px">
      <button class="btn" data-act="fechardia">Fechar o dia e gerar ${DIAS[pd.getDay()]} ${pd.getDate()}/${String(pd.getMonth()+1).padStart(2,'0')}</button>
    </div>
    <p class="note">A lista traz os produtos da ordem do dia mais qualquer um que já tenha lançamento.
      Para um produto fora da lista, use a busca acima ou o botão Todos.
      ${S.cfg.modoProd==='ordem'
        ? 'A coluna <b>Produzido</b> é opcional: deixando em branco, o app considera que a fábrica fez a quantidade da ordem, que aparece em cinza no campo. Preencha só quando sair diferente.'
        : 'A coluna <b>Produzido</b> alimenta o estoque, então precisa ser preenchida todo dia.'}
      Ao fechar o dia, o estoque é recalculado e a ordem do dia seguinte é gerada.</p>`;
}

/* --------------------------------------------------------- aba: vendas */
function vVendas(){
  const ini=semana, fim=addDias(semana,4);
  const rot=`${ini.getDate()} de ${MESES[ini.getMonth()]} a ${fim.getDate()} de ${MESES[fim.getMonth()]}`;
  const hojeIso=iso(HOJE);
  let chips='';
  for(let i=0;i<5;i++){const d=addDias(semana,i),k=iso(d),t=totalDia(k);
    chips+=`<button class="day${k===dia?' sel':''}${k===hojeIso?' today':''}" data-dia="${k}">
      <i>${DIAS[d.getDay()]}</i><b>${String(d.getDate()).padStart(2,'0')}</b><u id="d_${k}">${t?fmt0(t):''}</u></button>`}
  const tSem=[0,1,2,3,4].reduce((a,i)=>a+totalDia(iso(addDias(semana,i))),0);
  const d=new Date(dia+'T12:00:00');
  return `
  <section>
    <div class="weeknav">
      <button class="arrow" data-sem="-1" aria-label="Semana anterior">‹</button>
      <span class="lbl">${rot}</span>
      <button class="arrow" data-sem="1" aria-label="Próxima semana">›</button>
    </div>
    <div class="days">${chips}</div>
    <div class="figures">
      <div class="fig"><span>${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}</span>
        <b id="figdia">${fmt0(totalDia(dia))}<em>peças</em></b></div>
      <div class="fig"><span>total da semana</span><b id="figsem">${fmt0(tSem)}<em>peças</em></b></div>
    </div>
    <div class="dica">Use esta aba para <b>corrigir um dia passado</b> ou lançar vários de uma vez.
      O dia a dia normal você faz na aba Dia.</div>
    <div class="tools">
      <input type="text" id="filtro" placeholder="Filtrar produto" value="${filtro.replace(/"/g,'&quot;')}">
      <button class="btn ghost" data-act="colar">Colar do Excel</button>
    </div>
    ${lista(p=>vendaDia(dia,p.id),'venda')}
    <p class="note">Digite o que foi vendido no dia selecionado. Cada número é salvo sozinho, sem botão de salvar.
      Como a fábrica trabalha de segunda a sexta, o que for vendido no fim de semana entra na segunda.</p>
  </section>`;
}

/* --------------------------------------------------------- aba: estoque */
function secEstoque(){
  const tot=S.produtos.reduce((a,p)=>a+(S.estoque[p.id]||0),0);
  const hoje=S.produtos.reduce((a,p)=>a+estoqueHoje(p.id),0);
  return `
  <section>
    <h2>Contagem de estoque</h2>
    <div class="dica">Você só mexe aqui quando fizer <b>contagem física</b>. No resto do tempo o
      estoque anda sozinho: soma o que foi produzido e desconta o que foi vendido.</div>
    <div class="figures">
      <div class="fig"><span>estoque hoje</span><b>${fmt0(hoje)}<em>peças</em></b></div>
      <div class="fig"><span>na contagem</span><b id="figest">${fmt0(tot)}<em>peças</em></b></div>
      <div class="fig"><span>contado em</span><b style="font-size:17px">${S.cfg.contagem?S.cfg.contagem.split('-').reverse().join('/'):'—'}</b></div>
    </div>
    <div class="field"><span>Data da contagem</span>
      <input type="date" id="dtcontagem" value="${S.cfg.contagem||''}"></div>
    <div class="tools"><input type="text" id="filtro" placeholder="Filtrar produto" value="${filtro.replace(/"/g,'&quot;')}"></div>
    ${lista(p=>S.estoque[p.id]||0,'estoque',p=>{
      const h=estoqueHoje(p.id),b=S.estoque[p.id]||0;
      return h===b?'':'hoje: '+fmt0(h)+(h<0?' (contagem atrasada)':'');
    })}
  </section>`;
}

/* ------------------------------------------------------ aba: programação */
function opcoesMes(){
  const out=[];const d=new Date(HOJE.getFullYear(),HOJE.getMonth(),1);
  for(let i=0;i<13;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    out.push(k);d.setMonth(d.getMonth()+1)}
  return out;
}
function vMes(){
  const seg=`<div class="seg">
      <button data-modomes="prog" class="${modoMes==='prog'?'sel':''}">Programação</button>
      <button data-modomes="analise" class="${modoMes==='analise'?'sel':''}">Análise do mês</button>
    </div>`;
  const dica=modoMes==='analise'
    ? `<div class="dica">Fechamento do mês para apresentar. O botão no fim da página imprime em
       duas folhas, com marca e gráficos.</div>`
    : `<div class="dica">Visão do mês inteiro: quanto falta produzir de cada produto até o
       fechamento. O dia a dia sai da aba Dia.</div>`;
  return seg + dica + (modoMes==='analise'?vAnalise():vProg());
}

function barras(lista,total,classe){
  const max=lista.length?lista[0][1]:1;
  return `<div class="panel barras">`+lista.map(([k,v])=>`
    <div class="barra ${classe||''}"><div class="rot"><span>${k}</span>
      <em>${fmt0(v)} · ${(v/total*100).toFixed(0)}%</em></div>
      <div class="tri"><i style="width:${(v/max*100).toFixed(1)}%"></i></div></div>`).join('')+`</div>`;
}

function vAnalise(){
  const fechados=mesesComDados().filter(mesFechado);
  if(!fechados.length)return `<div class="warn">Nenhum mês fechado com dados para analisar.</div>`;
  if(!mesAnalise||!fechados.includes(mesAnalise))mesAnalise=fechados[fechados.length-1];
  const A=analiseMes(mesAnalise);
  const dif=A.totalAnt?(A.total-A.totalAnt):null;
  const pct=A.totalAnt?((A.total/A.totalAnt-1)*100):null;
  const linhasTop=A.top.map((i,n)=>{
    const acc=A.top.slice(0,n+1).reduce((a,x)=>a+x.q,0);
    return `<div class="prow"><div class="pn">${i.nome}</div>
      <div class="pd"><span class="c" data-l="do total">${pc(i.q/A.total*100)}%</span>
      <span class="c" data-l="acumulado">${(acc/A.total*100).toFixed(0)}%</span></div>
      <span class="pf">${fmt0(i.q)}</span></div>`}).join('');
  const mov=(l,sinal)=>l.length?`<div class="panel barras">`+l.map(x=>`
      <div class="barra ${sinal>0?'':'ocre'}"><div class="rot"><span>${x.nome}</span>
        <em>${x.d>0?'+':''}${fmt0(x.d)} · de ${fmt0(x.a)} para ${fmt0(x.b)}</em></div></div>`).join('')
      +`</div>`:`<p class="note">Sem movimento relevante.</p>`;

  return `
    <div class="field"><span>Mês analisado</span>
      <select id="mesanalise">${fechados.slice().reverse().map(k=>
        `<option value="${k}"${k===mesAnalise?' selected':''}>${mesNome(k)}</option>`).join('')}</select></div>
    <div class="kpis">
      <div class="kpi"><span>produção total</span><b>${fmt0(A.total)}</b><i>peças no mês</i></div>
      <div class="kpi"><span>por dia útil</span><b>${fmt0(A.porDia)}</b><i>em ${A.du} dias</i></div>
      <div class="kpi"><span>produtos ativos</span><b>${A.itens.length}</b><i>de ${S.produtos.length} no cadastro</i></div>
      <div class="kpi"><span>vs ${A.ant?mesCurto(A.ant):'—'}</span>
        <b>${dif===null?'—':(dif>0?'+':'')+fmt0(dif)}</b>
        <i class="${pct===null?'':pct>=0?'sobe':'desce'}">${pct===null?'sem base':(pct>0?'+':'')+pc(pct)+'%'}</i></div>
    </div>
    ${resumoExecutivo(A)}
    <h3 class="bloco">Evolução mês a mês</h3>
    <div class="panel">${gColunas(A.serie,A.mes)}${leituraEvolucao(A)}</div>
    <h3 class="bloco">Composição por linha de produto</h3>
    <div class="panel">${gRosca(A.linhas,A.total,'Composição por linha')}${leituraLinhas(A)}</div>
    <h3 class="bloco">Composição por acabamento</h3>
    <div class="panel">${gRosca(A.cores,A.total,'Composição por acabamento')}${leituraCores(A)}</div>
    <h3 class="bloco">Com costura e sem costura</h3>
    ${barras(A.grupos,A.total)}
    <h3 class="bloco">Curva ABC — os dez maiores</h3>
    <div class="panel">${gPareto(A.itens,A.total)}
      <p class="note" style="padding:0 13px 8px">Barras: peças produzidas. Linha ocre: participação
        acumulada, lida de baixo para cima. A tracejada marca os 80%.</p>
      ${leituraABC(A)}</div>
    <div class="panel plist" style="margin-top:10px">
      <div class="prow phead"><div class="pn">Produto</div>
        <div class="pd"><span class="c">Do total</span><span class="c">Acumulado</span></div>
        <span class="pf">Peças</span></div>
      ${linhasTop}
    </div>

    ${A.ant?`<h3 class="bloco">Variação contra ${mesNome(A.ant)}</h3>
    <div class="panel">${gDiverg(A.altas.concat(A.quedas))}</div>`:''}
    <div class="tools" style="margin-top:14px">
      <button class="btn" data-act="imprimiranalise">Imprimir para a diretoria</button>
      <button class="btn ghost" data-act="csvanalise">Baixar CSV</button>
    </div>
    <p class="note">Os números vêm do total mensal de cada produto. Nos meses trazidos da sua
      planilha, é o total da coluna “Total” de cada aba; nos meses lançados no app, é a soma dos dias.</p>`;
}

function vProg(){
  const P=programacao(mesAlvo);
  const fazer=P.itens.filter(i=>i.fazer>0).sort((a,b)=>b.fazer-a.fazer);
  const zero=P.itens.filter(i=>i.fazer===0);
  const ritmo=P.duRest?Math.round(P.total/P.duRest):0;
  let aviso='';
  if(!P.base.length) aviso=`<div class="warn">Ainda não há mês fechado com vendas lançadas para calcular a previsão. Lance pelo menos um mês completo na aba Vendas.</div>`;
  else if(P.base.length<3) aviso=`<div class="ok">Previsão calculada com ${P.base.length} mês${P.base.length>1?'es':''} de histórico (${P.base.map(mesCurto).join(', ')}). Fica mais firme quando houver três.</div>`;
  const semBase=P.itens.filter(i=>i.semBase).length;

  let rows='';
  for(const i of fazer){
    rows+=`<div class="prow"><div class="pn">${i.nome}</div>
      <div class="pd"><span class="c" data-l="estoque">${fmt(i.est)}</span>
      <span class="c" data-l="previsão">${fmt(i.prevRest)}</span>
      <span class="c" data-l="segurança">${fmt(i.seg)}</span></div>
      <span class="pf">${fmt0(i.fazer)}</span></div>`}
  return `
  <section>
    <div class="two">
      <div class="field"><span>Mês a programar</span>
        <select id="mesalvo">${opcoesMes().map(k=>`<option value="${k}"${k===mesAlvo?' selected':''}>${mesNome(k)}</option>`).join('')}</select></div>
      <div class="field"><span>Dias úteis no mês</span>
        <input type="number" id="duteis" min="1" max="31" value="${P.duTot}"></div>
      <div class="field"><span>Dias de venda a manter em estoque</span>
        <input type="number" id="cobertura" min="0" max="60" value="${S.cfg.cobertura}"></div>
    </div>
    ${aviso}
    <div class="figures">
      <div class="fig"><span>total a produzir</span><b>${fmt0(P.total)}<em>peças</em></b></div>
      <div class="fig"><span>por dia útil${P.atual?' restante':''}</span><b>${fmt0(ritmo)}<em>em ${P.duRest} dias</em></b></div>
      <div class="fig"><span>itens na lista</span><b>${fazer.length}<em>de ${P.itens.length}</em></b></div>
    </div>
    <div class="panel plist">
      <div class="prow phead"><div class="pn">Produto</div>
        <div class="pd"><span class="c">Estoque</span><span class="c">Previsão</span>
        <span class="c">Segurança</span></div><span class="pf">A produzir</span></div>
      ${rows||'<div class="pad sub">Nada a produzir com os números atuais.</div>'}
      ${fazer.length?`<div class="prow ptot"><div class="pn">Total</div><span class="pf">${fmt0(P.total)}</span></div>`:''}
    </div>
    <div class="tools" style="margin-top:12px">
      <button class="btn" data-act="imprimir">Imprimir folha da produção</button>
      <button class="btn ghost" data-act="csv">Baixar CSV</button>
    </div>
    <p class="note">
      A produzir = previsão de vendas + estoque de segurança − estoque atual.
      ${P.base.length?`Previsão pela média de ${P.base.map(mesNome).join(', ')}.`:''}
      ${P.atual?` Como ${mesNome(mesAlvo)} já começou, a previsão foi reduzida para os ${P.duRest} dias úteis que faltam.`:''}
      ${semBase?` ${semBase} produto${semBase>1?'s ficam':' fica'} fora da conta por não ter histórico de vendas.`:''}
      ${zero.length?`<br>Sem necessidade neste mês: ${zero.map(i=>i.nome).join('; ')}.`:''}
    </p>
  </section>`;
}

/* ----------------------------------------------------------- aba: dados */
function vDados(){
  const meses=mesesComDados().reverse();
  const comoFunciona=`
  <section>
    <h2>Como o app funciona</h2>
    <div class="panel pad">
      <ol class="passos">
        <li>Todo fim de dia, na aba <b>Dia</b>, você toca em <b>Fechar o dia</b> e lança
          <b>quanto vendeu</b> de cada produto.${S.cfg.modoProd==='ordem'
            ? ' A produção não precisa ser lançada: o app considera que a fábrica fez o que estava na ordem.'
            : ' Lance também quanto foi produzido.'}</li>
        <li>Ao fechar, o app atualiza o estoque de cada item e <b>gera a ordem do dia seguinte</b>,
          já pronta para imprimir e entregar na produção.</li>
        <li>A aba <b>Mês</b> mostra a visão do mês inteiro e, no outro botão, a análise para
          apresentar à diretoria.</li>
      </ol>
    </div>
    <div class="panel pad" style="margin-top:10px">
      <p class="sub" style="margin-bottom:7px"><b>De onde saem os números</b></p>
      <p class="note" style="margin-top:0">
        <b>Previsão de vendas:</b> média dos três últimos meses fechados, produto por produto.
        Conforme você lança as vendas do mês corrente, esses dias entram na conta e vão ganhando
        peso, até responderem por 70% da previsão.<br>
        <b>Estoque de segurança:</b> o quanto você vende em ${S.cfg.cobertura} dias — é o colchão para
        não faltar peça. Dá para mudar esse número na aba Dia.<br>
        <b>Quanto produzir:</b> previsão + colchão − o que já existe em estoque. Nunca passa da
        capacidade que a fábrica dá conta no dia.<br>
        <b>Ordem do dia:</b> primeiro os produtos a menos de dois dias de acabar, depois o ritmo
        necessário para fechar o mês, e por último os lotes pequenos que ainda faltam.</p>
    </div>
  </section>`;
  const linhas=meses.map(m=>{
    const lanc=lancadoNoMes(m);
    return `<tr><td class="prod">${mesNome(m)}</td><td>${fmt0(totalMes(m))}</td>
      <td class="${lanc?'':'zero'}">${lanc?'lançado':'inicial'}</td>
      <td class="${mesFechado(m)?'':'zero'}">${mesFechado(m)?'fechado':'em curso'}</td></tr>`}).join('');
  const modo=`
  <section>
    <h2>Como o estoque é atualizado</h2>
    <div class="seg">
      <button data-modoprod="ordem" class="${S.cfg.modoProd!=='lancada'?'sel':''}">A fábrica cumpre a ordem</button>
      <button data-modoprod="lancada" class="${S.cfg.modoProd==='lancada'?'sel':''}">Eu lanço a produção</button>
    </div>
    <div class="panel pad">
      <p class="note" style="margin-top:0">${S.cfg.modoProd==='lancada'
        ? 'O estoque só sobe com o que você digitar na coluna <b>Produzido</b>. Se um dia ficar sem lançamento, o estoque fica menor do que a realidade e a ordem do dia seguinte vem inflada.'
        : 'Escolha certa para quem não consegue anotar a produção todo dia. O app considera que a fábrica produziu o que estava na ordem, e você só digita quando sair diferente. Como a conta trabalha com uma suposição, <b>faça contagem física de tempos em tempos</b> — é ela que corrige o rumo.'}</p>
    </div>
  </section>`;
  return comoFunciona + modo + secEstoque() + `
  <section>
    <h2>Meses de vendas</h2>
    <div class="panel" style="overflow:hidden">
      <table><thead><tr><th>Mês</th><th>Vendas</th><th>Origem</th><th>Situação</th></tr></thead>
      <tbody>${linhas}</tbody></table>
    </div>
    <p class="note">Os meses marcados como “inicial” vieram da sua planilha de produção diária, de fevereiro a setembro de 2026. Quando você lançar vendas em um desses meses, o lançamento passa a valer no lugar. Só meses fechados entram na média da previsão.</p>
  </section>
  <section>
    <h2>Novo produto</h2>
    <div class="panel pad">
      <div class="field"><span>Nome como aparece na sua planilha</span>
        <input type="text" id="npnome" placeholder="Ex.: Lumina 60x40 S/Costura - Verde"></div>
      <div class="field"><span>Grupo</span>
        <select id="npgrupo"><option value="S">sem costura</option><option value="C">com costura</option></select></div>
      <button class="btn" data-act="addprod">Adicionar produto</button>
      ${S.extras.length?`<p class="note">Adicionados por você: ${S.extras.map(p=>p.nome).join('; ')}.</p>`:''}
    </div>
  </section>
  <section>
    <h2>Acessos</h2>
    <div class="panel pad">
      ${S.acesso.gestor?'':`<div class="ok">Sem PIN definido, o app abre direto no perfil de gestor.
        Defina o PIN abaixo para separar o acesso da produção.</div>`}
      <div class="two">
        <div class="field"><span>PIN do gestor (você)</span>
          <input type="text" inputmode="numeric" id="pingestor" value="${S.acesso.gestor||''}" placeholder="ex.: 4071"></div>
        <div class="field"><span>PIN da produção (em branco = sem PIN)</span>
          <input type="text" inputmode="numeric" id="pinproducao" value="${S.acesso.producao||''}" placeholder="opcional"></div>
      </div>
      <p class="note">O perfil de produção abre direto na ordem do dia e só pode anotar o que foi
        produzido. Não vê vendas, estoque, previsão nem os parâmetros de cálculo, e não apaga dados.
        Os lançamentos feitos por ele aparecem marcados para você no fechamento do dia.</p>
      <p class="note">O aparelho lembra quando o perfil escolhido é o de produção, para o pessoal da
        fábrica não digitar PIN toda hora. O perfil de gestor <b>nunca</b> fica lembrado: ele pede o
        PIN a cada vez que o app é aberto. Se o PIN da produção ficar em branco, aquele perfil entra
        com um toque, sem senha — o que é conveniente no tablet da fábrica e ruim num celular que
        sai da empresa.</p>
      <p class="note">Este PIN separa funções e evita mexida sem querer, mas não é segurança de
        verdade: quem tiver o arquivo e souber abrir o código do navegador consegue contornar.
        Para trancar de fato, é preciso login com banco de dados.</p>
    </div>
  </section>
  <section>
    <h2>Cópia de segurança</h2>
    <div class="panel pad">
      <p class="sub" style="margin-bottom:10px">Baixe um arquivo com tudo que você já lançou. Serve para guardar, passar para outro aparelho ou recuperar depois.</p>
      <div class="tools">
        <button class="btn" data-act="backup">Baixar cópia</button>
        <button class="btn ghost" data-act="restaurar">Restaurar de um arquivo</button>
      </div>
    </div>
  </section>
  <section>
    <h2>Apagar tudo</h2>
    <div class="panel pad">
      <p class="sub" style="margin-bottom:10px">Remove vendas, estoque e produtos adicionados, e volta aos números iniciais da planilha.</p>
      <button class="btn danger" data-act="zerar">Apagar meus dados</button>
    </div>
  </section>`;
}

/* ------------------------------------------------------------- impressão */
function folha(){
  const P=programacao(mesAlvo);
  const fazer=P.itens.filter(i=>i.fazer>0).sort((a,b)=>b.fazer-a.fazer);
  const ritmo=P.duRest?Math.round(P.total/P.duRest):0;
  const hoje=iso(HOJE).split('-').reverse().join('/');
  document.getElementById('print').innerHTML=`
    <svg class="marca-papel" role="img" aria-label="WE MIRROR"><use href="#marca"/></svg>
    <h1>Programação de produção — ${mesNome(mesAlvo)}</h1>
    <div class="m">Emitido em ${hoje} &nbsp;•&nbsp; ${fmt0(P.total)} peças no total &nbsp;•&nbsp;
      ${fmt0(ritmo)} peças por dia útil em ${P.duRest} dias &nbsp;•&nbsp; ${fazer.length} produtos</div>
    <table><thead><tr><th style="text-align:left">Produto</th><th>Estoque</th><th>Previsão</th>
      <th>Segurança</th><th>A produzir</th><th style="width:70px">Produzido</th></tr></thead><tbody>
      ${fazer.map(i=>`<tr><td style="text-align:left">${i.nome}</td><td>${fmt(i.est)}</td>

    </tbody></table>
    <div class="rodape">WE MIRROR® &nbsp;·&nbsp; programação mensal &nbsp;·&nbsp;
      emitida em ${iso(HOJE).split('-').reverse().join('/')}</div>`;

}

    <table><thead><tr><th style="text-align:left">Produto</th><th>Estoque</th><th>Falta no mês</th>
      <th>Produzir</th><th style="width:70px">Produzido</th></tr></thead><tbody>
      ${lin.map(i=>`<tr><td style="text-align:left">${i.nome}</td><td>${fmt(i.est)}</td>
        <td>${fmt(i.nec)}</td><td class="make">${fmt0(i.qtd)}</td><td></td></tr>`).join('')}
      <tr><td style="text-align:left"><b>Total</b></td><td></td><td></td>
        <td class="make"><b>${fmt0(tot)}</b></td><td></td></tr>

      emitida em ${iso(HOJE).split('-').reverse().join('/')} &nbsp;·&nbsp; conferido por ____________________</div>`;

function folhaAnalise(){

  const pct=A.totalAnt?((A.total/A.totalAnt-1)*100):null;
  const cab=(pag)=>`
    <table class="limpa topo"><tbody><tr>
      <td><svg class="marca-papel" role="img" aria-label="WE MIRROR"><use href="#marca"/></svg></td>
      <td style="text-align:right">Análise da produção &nbsp;·&nbsp; ${mesNome(A.mes)}
        &nbsp;·&nbsp; emitida em ${iso(HOJE).split('-').reverse().join('/')}
        &nbsp;·&nbsp; ${pag} de 2</td>
    </tr></tbody></table>`;
  const dez=A.top.map((i,n)=>{
    const acc=A.top.slice(0,n+1).reduce((a,x)=>a+x.q,0);
    return `<tr><td style="text-align:left">${n+1}. ${i.nome}</td><td>${fmt0(i.q)}</td>
      <td>${pc(i.q/A.total*100)}%</td><td>${(acc/A.total*100).toFixed(0)}%</td></tr>`}).join('');

  document.getElementById('print').innerHTML=`
    ${cab(1)}
    <h1>Análise da produção — ${mesNome(A.mes)}</h1>
    <div class="m">${A.du} dias úteis no mês &nbsp;·&nbsp; ${A.itens.length} produtos ativos de
      ${S.produtos.length} no cadastro &nbsp;·&nbsp; base: ${A.serie.map(x=>mesCurto(x.mes)).join(', ')}</div>

    <table class="kpi4"><tbody><tr>
      <td><b>${fmt0(A.total)}</b><span>peças produzidas no mês</span></td>
      <td><b>${fmt0(A.porDia)}</b><span>peças por dia útil</span></td>
      <td><b>${A.itens.length}</b><span>produtos ativos</span></td>
      <td><b>${pct===null?'—':(pct>0?'+':'')+pc(pct)+'%'}</b>
          <span>contra ${A.ant?mesNome(A.ant):'—'}</span></td>
    </tr></tbody></table>

    ${resumoExecutivo(A)}

    <h2>Produção mês a mês</h2>
    <div class="gp">${gColunas(A.serie,A.mes,{W:744,H:318,ml:64,mr:26,fs:13})}</div>
    ${leituraEvolucao(A)}

    <h2>Composição da produção</h2>
    <table class="limpa duas"><tbody><tr>
      <td><h3>Por linha de produto</h3>
        <div class="gp">${gRosca(A.linhas,A.total,'linha')}</div>
        ${leituraLinhas(A)}</td>
      <td><h3>Por acabamento</h3>
        <div class="gp">${gRosca(A.cores,A.total,'acabamento')}</div>
        ${leituraCores(A)}</td>
    </tr></tbody></table>

    <div class="pag2">
      ${cab(2)}
      <h2 class="primeiro">Curva ABC — concentração da produção</h2>
      <div class="gp">${gPareto(A.itens,A.total,{W:744,H:286,mb:92,mr:66,fs:10.5,fsv:11.5,lim:22})}</div>
      <p class="obs">Barras: peças produzidas por produto. Linha ocre: participação acumulada,
        lida de baixo para cima. A tracejada marca os 80% do volume.</p>
      ${leituraABC(A)}

      <h2>Os dez maiores em números</h2>
      <table class="dez"><thead><tr><th style="text-align:left">Produto</th><th>Peças</th>
        <th>Do total</th><th>Acumulado</th></tr></thead><tbody>${dez}</tbody></table>

      ${A.ant?`<h2>Variação por produto contra ${mesNome(A.ant)}</h2>
      <div class="gp">${gDiverg(A.altas.concat(A.quedas),{W:744,lh:23,xRot:320,fs:11,lim:40})}</div>
      <p class="obs">Verde: produtos que cresceram. Vermelho: produtos que recuaram.
        Cinco maiores altas e cinco maiores quedas, em peças.</p>`:''}

      <div class="rodape">WE MIRROR® &nbsp;·&nbsp; análise de produção &nbsp;·&nbsp;
        ${mesNome(A.mes)} &nbsp;·&nbsp; emitida em ${iso(HOJE).split('-').reverse().join('/')}</div>
    </div>`;
  setTimeout(()=>window.print(),60);
}
function csvAnalise(){
  const A=analiseMes(mesAnalise);
  const l=[['Produto','Grupo','Linha','Acabamento','Pecas produzidas','% do total']];
  A.itens.forEach(i=>l.push([i.nome,i.grupo==='C'?'Com costura':'Sem costura',
    linhaDe(i.nome),corDe(i.nome),i.q,(i.q/A.total*100).toFixed(2).replace('.',',')]));
  l.push(['TOTAL','','','',A.total,'100']);
  baixar('analise-producao-'+A.mes+'.csv',l.map(r=>r.join(';')).join('\n'),'text/csv');
}
function csv(){
  const P=programacao(mesAlvo);
  const l=[['Produto','Grupo','Estoque atual','Previsao de vendas','Estoque de seguranca','Quantidade a produzir']];
  P.itens.forEach(i=>l.push([i.nome,i.grupo==='C'?'Com costura':'Sem costura',i.est,i.prevRest,i.seg,i.fazer]));
  baixar('programacao-'+mesAlvo+'.csv',l.map(r=>r.join(';')).join('\n'),'text/csv');
}
function baixar(nome,txt,tipo){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:tipo+';charset=utf-8'}));
  a.download=nome;a.click();URL.revokeObjectURL(a.href);
}

/* ---------------------------------------------------------------- modais */
function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('on')}
function fecharModal(){document.getElementById('modal').classList.remove('on')}
function modalColar(){
  modal(`<h3>Colar do Excel</h3>
    <p class="sub" style="margin-bottom:10px">Copie duas colunas da sua planilha — nome do produto e quantidade — e cole abaixo.
    Os números entram no dia ${dia.split('-').reverse().join('/')}.</p>
    <textarea id="colartxt" rows="9" placeholder="Effect 60x40 S/Costura - Marrom&#9;120&#10;Bandeja Effect 38x26 S/C - Marrom&#9;64"></textarea>
    <div class="tools" style="margin-top:11px"><button class="btn" data-act="colarok">Lançar no dia</button>
    <button class="btn ghost" data-act="fechar">Cancelar</button></div>`);
}
function processarColagem(){
  const txt=document.getElementById('colartxt').value;
  const mapa={};S.produtos.forEach(p=>mapa[chave(p.nome)]=p.id);
  let ok=0;const nao=[];
  txt.split(/\r?\n/).forEach(l=>{
    if(!l.trim())return;
    const p=l.split(/\t|;|\s{2,}/).filter(x=>x.trim()!=='');
    if(p.length<2){nao.push(l.trim());return}
    const q=parseInt(String(p[p.length-1]).replace(/[^\d-]/g,''),10);
    const id=mapa[chave(p.slice(0,-1).join(' '))];
    if(!id||isNaN(q)){nao.push(l.trim());return}
    setVenda(dia,id,q);ok++;
  });
  fecharModal();render();
  modal(`<h3>${ok} produto${ok===1?'':'s'} lançado${ok===1?'':'s'}</h3>
    ${nao.length?`<p class="sub" style="margin:8px 0">Estas linhas não bateram com nenhum produto e ficaram de fora:</p>
      <p style="font-size:13px">${nao.slice(0,15).join('<br>')}</p>
      <p class="sub" style="margin-top:8px">Confira o nome ou cadastre o produto na aba Dados.</p>`
      :'<p class="sub" style="margin-top:8px">Tudo bateu com os produtos cadastrados.</p>'}
    <div class="tools" style="margin-top:12px"><button class="btn" data-act="fechar">Fechar</button></div>`);
}
function backup(){
  baixar('vendas-espelhos-'+iso(HOJE)+'.json',
    JSON.stringify({v:3,vendas:S.vendas,producao:S.producao,ordens:S.ordens,estoque:S.estoque,cfg:S.cfg,extras:S.extras}),'application/json');
}
function restaurar(){
  modal(`<h3>Restaurar de um arquivo</h3>
    <p class="sub" style="margin-bottom:10px">Escolha o arquivo .json que você baixou antes. Isso substitui os lançamentos atuais.</p>
    <input type="file" id="arq" accept=".json,application/json">
    <div class="tools" style="margin-top:12px"><button class="btn ghost" data-act="fechar">Cancelar</button></div>`);
  document.getElementById('arq').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      S.vendas=d.vendas||{};S.producao=d.producao||{};S.ordens=d.ordens||{};
      S.estoque=d.estoque||{};S.extras=d.extras||[];
      if(d.cfg)S.cfg=Object.assign(S.cfg,d.cfg);
      S.produtos=SEED.produtos.concat(S.extras);
      for(const m of new Set(Object.keys(S.vendas).map(mesDe))){
        const b={};for(const k in S.vendas)if(mesDe(k)===m)b[k]=S.vendas[k];await sSet('esp:vendas:'+m,b)}
      for(const m of new Set(Object.keys(S.producao).map(mesDe))){
        const b={};for(const k in S.producao)if(mesDe(k)===m)b[k]=S.producao[k];await sSet('esp:producao:'+m,b)}
      for(const m of new Set(Object.keys(S.ordens).map(mesDe))){
        const b={};for(const k in S.ordens)if(mesDe(k)===m)b[k]=S.ordens[k];await sSet('esp:ordem:'+m,b)}
      await sSet(KEY_EST,S.estoque);await sSet(KEY_CFG,S.cfg);await sSet(KEY_PROD,S.extras);
      fecharModal();render();marcar('salvo');
    }catch(err){
      modal(`<h3>Arquivo não reconhecido</h3><p class="sub" style="margin-top:8px">
        Use o arquivo .json gerado pelo botão “Baixar cópia”.</p>
        <div class="tools" style="margin-top:12px"><button class="btn" data-act="fechar">Fechar</button></div>`);
    }
  };
}

/* --------------------------------------------------------------- eventos */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-dia],[data-sem],[data-dnav],[data-modo],[data-modomes],[data-modoprod],[data-perfil],[data-act]');
  if(!t)return;
  if(t.dataset.perfil){
    const alvo=t.dataset.perfil;
    const pin=alvo==='gestor'?S.acesso.gestor:S.acesso.producao;
    if(pin){tentativa=alvo;erroPin='';render()}
    else{perfil=alvo;await sSet(KEY_PERFIL, alvo==='producao'?'producao':'');render()}
    return}
  if(t.dataset.tab){view=t.dataset.tab;filtro='';recado='';render();return}
  if(t.dataset.modo){modoDia=t.dataset.modo;filtro='';recado='';render();return}
  if(t.dataset.modomes){modoMes=t.dataset.modomes;render();return}
  if(t.dataset.modoprod){S.cfg.modoProd=t.dataset.modoprod;
    await sSet(KEY_CFG,S.cfg);render();marcar('salvo');return}
  if(t.dataset.dia){dia=t.dataset.dia;render();return}
  if(t.dataset.sem){semana=addDias(semana,7*Number(t.dataset.sem));
    const k=iso(semana);dia=k;render();return}
  if(t.dataset.dnav){recado='';const p=Number(t.dataset.dnav);
    let d=addDias(new Date(dataDia+'T12:00:00'),p);
    while(!ehUtil(d))d=addDias(d,p);dataDia=iso(d);render();return}
  const a=t.dataset.act;
  if(a==='colar')modalColar();
  if(a==='colarok')processarColagem();
  if(a==='fechar')fecharModal();
  if(a==='voltarperfil'){tentativa=null;erroPin='';render()}
  if(a==='entrar'){
    const v=(document.getElementById('pin')||{}).value||'';
    const pin=tentativa==='gestor'?S.acesso.gestor:S.acesso.producao;
    if(v===pin){perfil=tentativa;tentativa=null;erroPin='';view='dia';
      await sSet(KEY_PERFIL, perfil==='producao'?'producao':'');render()}
    else{erroPin='PIN incorreto.';render()}
    return}
  if(a==='trocarperfil'){perfil=null;tentativa=null;erroPin='';
    await sSet(KEY_PERFIL,'');render();return}
  if(a==='imprimir')folha();
  if(a==='imprimirdia')folhaDia();
  if(a==='imprimiranalise')folhaAnalise();
  if(a==='csvanalise')csvAnalise();
  if(a==='todosprod'){fecharTodos=!fecharTodos;render()}
  if(a==='reemitir'){const P=emitirOrdem(dataDia);
    recado=`Ordem de ${dataDia.split('-').reverse().slice(0,2).join('/')} emitida: ${fmt0(P.usado)} peças em ${P.plano.length} produtos.`;
    render();marcar('salvo')}
  if(a==='fechardia'){
    const prox=iso(proxDiaUtil(new Date(dataDia+'T12:00:00')));
    const ant=dataDia;
    const P=emitirOrdem(prox);
    const pd=new Date(prox+'T12:00:00');
    dataDia=prox;modoDia='ordem';
    recado=`Dia ${ant.split('-').reverse().slice(0,2).join('/')} fechado: ${fmt0(totalDia(ant))} vendidas e ${fmt0(totalProdDia(ant))} produzidas.
      Ordem de ${DIAS[pd.getDay()]}, ${pd.getDate()} de ${MESES[pd.getMonth()]} gerada com ${fmt0(P.usado)} peças.`;
    render();marcar('salvo')}
  if(a==='csv')csv();
  if(a==='backup')backup();
  if(a==='restaurar')restaurar();
  if(a==='addprod'){
    const nome=document.getElementById('npnome').value.trim();
    if(!nome)return;
    const id='x'+chave(nome).slice(0,30);
    if(S.produtos.some(p=>p.id===id))return;
    S.extras.push({id,nome,grupo:document.getElementById('npgrupo').value});
    S.produtos=SEED.produtos.concat(S.extras);
    await sSet(KEY_PROD,S.extras);render();marcar('salvo');
  }
  if(a==='zerar'){
    modal(`<h3>Apagar meus dados</h3><p class="sub" style="margin:8px 0">
      Vendas lançadas, estoque e produtos adicionados serão removidos. Não tem como desfazer.</p>
      <div class="tools"><button class="btn danger" data-act="zerarok">Apagar mesmo</button>
      <button class="btn ghost" data-act="fechar">Cancelar</button></div>`);
  }
  if(a==='zerarok'){
    try{const l=await window.storage.list('esp:');if(l&&l.keys)for(const k of l.keys)await window.storage.delete(k)}catch(err){}
    S.vendas={};S.producao={};S.ordens={};S.extras=[];S.estoque=Object.assign({},SEED.estoque);
    S.cfg={cobertura:10,dias:{},contagem:'2026-09-30',capacidade:0,lote:5,modoProd:'ordem'};S.produtos=SEED.produtos.slice();
    fecharModal();render();
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='filtro'){filtro=el.value;
    if(view==='dia'){const p=el.closest('section').querySelector('.plist');
      if(p){const tmp=document.createElement('div');tmp.innerHTML=dFechar();
        p.replaceWith(tmp.querySelector('.plist'))}
      return}
    const p=el.closest('section').querySelector('.panel');
    if(p)p.outerHTML=lista(view==='vendas'?(x=>vendaDia(dia,x.id)):(x=>S.estoque[x.id]||0),
      view==='vendas'?'venda':'estoque',
      view==='vendas'?null:(x=>{const h=estoqueHoje(x.id),b=S.estoque[x.id]||0;
        return h===b?'':'hoje: '+fmt0(h)+(h<0?' (contagem atrasada)':'')}));
    return}
  if(el.dataset.k==='venda'){
    const q=Math.max(0,parseInt(el.value||'0',10)||0);
    setVenda(dia,el.dataset.pid,q);
    el.classList.toggle('has',q>0);
    document.getElementById('figdia').innerHTML=fmt0(totalDia(dia))+'<em>peças</em>';
    const ts=[0,1,2,3,4].reduce((a,i)=>a+totalDia(iso(addDias(semana,i))),0);
    document.getElementById('figsem').innerHTML=fmt0(ts)+'<em>peças</em>';
    const u=document.getElementById('d_'+dia);if(u)u.textContent=totalDia(dia)?fmt0(totalDia(dia)):'';
    return}
  if(el.dataset.k==='vdia'){
    const q=Math.max(0,parseInt(el.value||'0',10)||0);
    setVenda(dataDia,el.dataset.pid,q);
    el.classList.toggle('has',q>0);
    const f=document.getElementById('figv');
    if(f)f.innerHTML=fmt0(totalDia(dataDia))+'<em>peças</em>';
    return}
  if(el.dataset.k==='prod'){
    const q=Math.max(0,parseInt(el.value||'0',10)||0);
    setProd(dataDia,el.dataset.pid,q);
    el.classList.toggle('has',q>0);
    const f=document.getElementById('figprod');
    if(f)f.innerHTML=fmt0(totalProdDia(dataDia))+'<em>peças</em>';
    const g=document.getElementById('figfalta');
    if(g)g.innerHTML=fmt0(Math.max(0,Number(g.dataset.tot)-totalProdDia(dataDia)))+'<em>peças</em>';
    return}
  if(el.dataset.k==='estoque'){
    const q=Math.max(0,parseInt(el.value||'0',10)||0);
    if(q>0)S.estoque[el.dataset.pid]=q;else delete S.estoque[el.dataset.pid];
    el.classList.toggle('has',q>0);
    const tot=S.produtos.reduce((a,p)=>a+(S.estoque[p.id]||0),0);
    const f=document.getElementById('figest');if(f)f.innerHTML=fmt0(tot)+'<em>peças</em>';
    salvarDepois('est',()=>sSet(KEY_EST,S.estoque));
    return}
  if(el.id==='dtcontagem'){S.cfg.contagem=el.value;salvarDepois('cfg',()=>sSet(KEY_CFG,S.cfg));return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='pingestor'||el.id==='pinproducao'){
    const v=el.value.replace(/\D/g,'').slice(0,8);el.value=v;
    S.acesso[el.id==='pingestor'?'gestor':'producao']=v;
    salvarDepois('acc',()=>sSet(KEY_ACC,S.acesso));render();return}
  if(el.id==='mesalvo'){mesAlvo=el.value;render();return}
  if(el.id==='mesanalise'){mesAnalise=el.value;render();return}
  if(el.id==='cobertura'){S.cfg.cobertura=Math.max(0,parseInt(el.value||'0',10)||0);
    salvarDepois('cfg',()=>sSet(KEY_CFG,S.cfg));render();return}
  if(el.id==='duteis'){const v=parseInt(el.value||'0',10);
    if(v>0){S.cfg.dias[mesAlvo]=v;salvarDepois('cfg',()=>sSet(KEY_CFG,S.cfg));render()}return}
  if(el.id==='capac'){const v=parseInt(el.value||'0',10);
    if(v>0){S.cfg.capacidade=v;salvarDepois('cfg',()=>sSet(KEY_CFG,S.cfg));render()}return}
  if(el.id==='lote'){const v=parseInt(el.value||'0',10);
    if(v>0){S.cfg.lote=v;salvarDepois('cfg',()=>sSet(KEY_CFG,S.cfg));render()}return}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')fecharModal()});
document.addEventListener('keydown',e=>{

}
